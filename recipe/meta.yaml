{% set name = "cuiman" %}
{% set version = "0.2.0" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/cuiman-{{ version }}.tar.gz
  sha256: 7fe40cb214ab7540b2b8718034693330a1192c26d1834b50569530c8c6bcd300

build:
  entry_points:
    - cuiman = cuiman.cli:cli
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatch
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - ipython
    - pydantic
    - pydantic-settings
    - pyyaml
    - remotestate >=0.3.4,<1
    - typer >=0.26.0,<1
    - uri-template
    - httpx
    - gavicore >=0.2.0

test:
  imports:
    - cuiman
  commands:
    - pip check
    - cuiman --help
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/eo-tools/eozilla/tree/main/cuiman
  doc_url: https://eo-tools.github.io/eozilla/
  dev_url: https://github.com/eo-tools/eozilla/
  summary: A client for the OGC API - Processes, Part 1.
  description: |
    Eozilla 🦖 Cuiman is a package that provides a client Python API, GUI, and CLI 
    for servers compliant with the OGC API - Processes, Part 1.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - AliceBalfanz
    - b-yogesh
    - clarasb
    - forman
    - konstntokas
    - pont-us
    - TejasMorbagal
    - thomasstorm
    - TonioF
